spring:
  application:
    name: blog

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5430/blog_db
    username: postgres
    password: 1234


  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true


